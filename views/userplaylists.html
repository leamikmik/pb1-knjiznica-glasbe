% rebase("base.html")

<form action="/seznami/" method="POST">
    <div class="form-container">
        <div class="field">
            <label class="label">Naslov seznama</label>
                <input class='input' type='text' name='name'/>
        </div>
        <div class="field">
            <input type="submit" value="Ustvari" />
        </div>
    </div>
</form>

<div class="search-results">
    % if playlists:
    % for p in playlists:
    <div class="result">
        <div class="title">
            <a href="/seznami/{{p.id}}/">{{p.name}}</a>
        </div>
        <div class="info">
            Število pesmi: {{len(p.songs)}} <br>
            Dolžina: {{p.length // 60}} minut <br>
            <a href="/seznami/dodaj/{{p.id}}/">Dodaj pesmi</a>
        </div>
    </div>
    % end
</div>
